[project]
name = "marktstammdatenplotter"
description = "Animated choropleth maps of German wind & solar capacity from the Marktstammdatenregister"
authors = ["Mayk Thewessen <m.thewessen@birdviewenergy.ai>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.2.0"

[dependencies]
python      = ">=3.11,<3.13"
numpy       = "*"
pandas      = "*"
matplotlib  = "*"
geopandas   = ">=1.0"
shapely     = ">=2"
pyogrio     = "*"
mapclassify = "*"
pyarrow     = "*"
pytest      = "*"
marimo      = ">=0.23"
jupyter     = "*"
ipykernel   = "*"
ffmpeg      = "*"
requests    = "*"

[tasks]
# One-shot scrapes — uses the README's curl recipes.
scrape-non-pv = """
mkdir -p data && \
for p in 1 2 3 4 5 6 7; do \
  curl --get 'https://www.marktstammdatenregister.de/MaStR/Einheit/EinheitJson/GetErweiterteOeffentlicheEinheitStromerzeugung' \
    --data-urlencode 'sort=' \
    --data-urlencode "page=$p" \
    --data-urlencode 'pageSize=25000' \
    --data-urlencode 'group=' \
    --data-urlencode "filter=Energieträger~neq~'2495'~and~Energieträger~neq~'2496'" \
    --data-urlencode 'forExport=true' \
    -o "data/data-$p.json" & \
done; wait
"""

scrape-pv-top = """
mkdir -p data-pv && \
for p in 1 2 3 4 5 6 7 8; do \
  curl --get 'https://www.marktstammdatenregister.de/MaStR/Einheit/EinheitJson/GetErweiterteOeffentlicheEinheitStromerzeugung' \
    --data-urlencode 'sort=Bruttoleistung-desc' \
    --data-urlencode "page=$p" \
    --data-urlencode 'pageSize=25000' \
    --data-urlencode 'group=' \
    --data-urlencode "filter=Energieträger~eq~'2495'" \
    --data-urlencode 'forExport=true' \
    -o "data-pv/data-$p.json" & \
done; wait
"""

# Battery + other electricity storage. Same endpoint as Stromerzeugung,
# filtered to Energieträger=2496 (Speicher). Top 200k by power captures
# everything from grid-scale Pumpspeicher down to ~10 kW home batteries.
scrape-bess = """
mkdir -p data-bess && \
for p in 1 2 3 4 5 6 7 8; do \
  curl --get 'https://www.marktstammdatenregister.de/MaStR/Einheit/EinheitJson/GetErweiterteOeffentlicheEinheitStromerzeugung' \
    --data-urlencode 'sort=Bruttoleistung-desc' \
    --data-urlencode "page=$p" \
    --data-urlencode 'pageSize=25000' \
    --data-urlencode 'group=' \
    --data-urlencode "filter=Energieträger~eq~'2496'" \
    --data-urlencode 'forExport=true' \
    -o "data-bess/data-$p.json" & \
done; wait
"""

# Build germany_kreise.gpkg from BKG VG2500 (1:2.5M Verwaltungsgebiete,
# stand 31.12). Post-reform Landkreis names (~ 400 rows) — closes the
# ~ 16 % name-match gap left by the pre-2007/2011 isellsoap GeoJSON.
# Licence: Datenlizenz Deutschland Namensnennung 2.0 (dl-de/by-2-0),
# attribution: "© GeoBasis-DE / BKG (2025)".
fetch-kreise = """
curl -sSL -o /tmp/vg2500.zip \
  'https://daten.gdz.bkg.bund.de/produkte/vg/vg2500/aktuell/vg2500_12-31.utm32s.gpkg.zip' && \
rm -rf /tmp/vg2500 && unzip -q -o /tmp/vg2500.zip -d /tmp/vg2500 && \
python -c "
import os, geopandas as gpd
src = '/tmp/vg2500/vg2500_12-31.utm32s.gpkg/vg2500/DE_VG2500.gpkg'
krs = gpd.read_file(src, layer='vg2500_krs')
lan = (gpd.read_file(src, layer='vg2500_lan')
         .drop_duplicates(subset='SN_L')[['SN_L', 'GEN']]
         .rename(columns={'GEN': 'bundesland'}))
krs = krs.merge(lan, on='SN_L', how='left').rename(columns={'GEN': 'name'})
city_states = {'Berlin', 'Hamburg', 'Bremen'}
krs['admin_level'] = krs.apply(
    lambda r: '4' if r['name'] in city_states and r['bundesland'] in city_states else '6',
    axis=1)
out = krs[['name', 'admin_level', 'bundesland', 'geometry']].to_crs('EPSG:4326')
dst = 'germany_kreise.gpkg'
if os.path.exists(dst): os.remove(dst)
out.to_file(dst, layer='multipolygons', driver='GPKG')
print('rows:', len(out))
"
"""

# Marimo notebook entry points
pv-edit   = "python -m marimo edit pv.py"
wind-edit = "python -m marimo edit wind.py"
pv-run    = "python -m marimo run pv.py"
wind-run  = "python -m marimo run wind.py"

# Docs build (re-exports the notebooks)
docs-build = """
python -m marimo export html pv.py   -o docs/pv.html && \
python -m marimo export html wind.py -o docs/wind.html
"""

# Re-render all sample SVGs + Bundesland + operators + offshore charts.
render-samples = "python scripts/render_samples.py"

# Re-render multi-year animation GIFs. Pass wind | pv | both (default both).
render-gifs   = "python scripts/render_wind_gif.py all"
render-wind   = "python scripts/render_wind_gif.py wind"
render-pv     = "python scripts/render_wind_gif.py pv"
render-bess   = "python scripts/render_wind_gif.py bess"

# Rebuild the per-Kreis JSON that drives the sortable docs table.
build-kreise   = "python scripts/build_kreise_json.py"

# Build the CSV + Parquet bulk-download artefacts under docs/data/.
build-downloads = "python scripts/build_downloads.py"

# Run unit tests.
test  = "python -m pytest tests/ -v"
tests = "python -m pytest tests/ -v"
