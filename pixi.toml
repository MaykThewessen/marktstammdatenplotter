[project]
name = "marktstammdatenplotter"
description = "Animated choropleth maps of German wind & solar capacity from the Marktstammdatenregister"
authors = ["Mayk Thewessen <m.thewessen@birdviewenergy.ai>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
version = "0.2.0"

[dependencies]
python      = ">=3.11,<3.13"
numpy       = "*"
pandas      = "*"
matplotlib  = "*"
geopandas   = ">=1.0"
shapely     = ">=2"
pyogrio     = "*"
mapclassify = "*"
marimo      = ">=0.23"
jupyter     = "*"
ipykernel   = "*"
ffmpeg      = "*"
requests    = "*"

[tasks]
# One-shot scrapes — uses the README's curl recipes.
scrape-non-pv = """
mkdir -p data && \
for p in 1 2 3 4 5 6 7; do \
  curl --get 'https://www.marktstammdatenregister.de/MaStR/Einheit/EinheitJson/GetErweiterteOeffentlicheEinheitStromerzeugung' \
    --data-urlencode 'sort=' \
    --data-urlencode "page=$p" \
    --data-urlencode 'pageSize=25000' \
    --data-urlencode 'group=' \
    --data-urlencode "filter=Energieträger~neq~'2495'~and~Energieträger~neq~'2496'" \
    --data-urlencode 'forExport=true' \
    -o "data/data-$p.json" & \
done; wait
"""

scrape-pv-top = """
mkdir -p data-pv && \
for p in 1 2; do \
  curl --get 'https://www.marktstammdatenregister.de/MaStR/Einheit/EinheitJson/GetErweiterteOeffentlicheEinheitStromerzeugung' \
    --data-urlencode 'sort=Bruttoleistung-desc' \
    --data-urlencode "page=$p" \
    --data-urlencode 'pageSize=25000' \
    --data-urlencode 'group=' \
    --data-urlencode "filter=Energieträger~eq~'2495'" \
    --data-urlencode 'forExport=true' \
    -o "data-pv/data-$p.json" & \
done; wait
"""

fetch-kreise = """
curl -sSL -o /tmp/kreise.geojson \
  'https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/4_kreise/4_niedrig.geo.json' && \
python -c "import geopandas as gpd; g = gpd.read_file('/tmp/kreise.geojson'); \
g = g.rename(columns={'NAME_3':'name','NAME_1':'bundesland'}); g['admin_level']='6'; \
g[['name','admin_level','bundesland','geometry']].to_file('germany_kreise.gpkg', layer='multipolygons', driver='GPKG')"
"""

# Marimo notebook entry points
pv-edit   = "python -m marimo edit pv.py"
wind-edit = "python -m marimo edit wind.py"
pv-run    = "python -m marimo run pv.py"
wind-run  = "python -m marimo run wind.py"

# Docs build (re-exports the notebooks)
docs-build = """
python -m marimo export html pv.py   -o docs/pv.html && \
python -m marimo export html wind.py -o docs/wind.html
"""
