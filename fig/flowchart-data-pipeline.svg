<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <linearGradient id="src" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="proc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce7f3"/><stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1180" height="640" fill="#f8fafc"/>

  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">
    Marktstammdatenplotter — Data Pipeline
  </text>
  <text x="590" y="56" text-anchor="middle" font-size="13" fill="#64748b">
    From public registry to animated choropleth
  </text>

  <!-- Row 1: Sources -->
  <g filter="url(#shadow)">
    <rect x="40"  y="100" width="220" height="80" rx="10" fill="url(#src)" stroke="#d97706" stroke-width="1.5"/>
    <text x="150" y="130" text-anchor="middle" font-weight="600">MaStR JSON API</text>
    <text x="150" y="150" text-anchor="middle" font-size="12" fill="#475569">marktstammdatenregister.de</text>
    <text x="150" y="166" text-anchor="middle" font-size="12" fill="#475569">paginated, filtered by Energieträger</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="100" width="220" height="80" rx="10" fill="url(#src)" stroke="#d97706" stroke-width="1.5"/>
    <text x="590" y="130" text-anchor="middle" font-weight="600">OSM Germany Extract</text>
    <text x="590" y="150" text-anchor="middle" font-size="12" fill="#475569">germany-latest.o5m</text>
    <text x="590" y="166" text-anchor="middle" font-size="12" fill="#475569">admin_level 4 + 6 boundaries</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="100" width="220" height="80" rx="10" fill="url(#src)" stroke="#d97706" stroke-width="1.5"/>
    <text x="1030" y="130" text-anchor="middle" font-weight="600">Synthetic Sea Zones</text>
    <text x="1030" y="150" text-anchor="middle" font-size="12" fill="#475569">Nordsee + Ostsee</text>
    <text x="1030" y="166" text-anchor="middle" font-size="12" fill="#475569">for offshore aggregation</text>
  </g>

  <!-- Row 2: Extract -->
  <g filter="url(#shadow)">
    <rect x="40"  y="230" width="220" height="80" rx="10" fill="url(#proc)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="150" y="260" text-anchor="middle" font-weight="600">curl + xargs scrape</text>
    <text x="150" y="280" text-anchor="middle" font-size="12" fill="#475569">parallel page fetch</text>
    <text x="150" y="296" text-anchor="middle" font-size="12" fill="#475569">25 000 rows / page</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="230" width="220" height="80" rx="10" fill="url(#proc)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="590" y="260" text-anchor="middle" font-weight="600">osmfilter + ogr2ogr</text>
    <text x="590" y="280" text-anchor="middle" font-size="12" fill="#475569">filter relations</text>
    <text x="590" y="296" text-anchor="middle" font-size="12" fill="#475569">export GeoPackage</text>
  </g>

  <!-- Row 3: Stored data -->
  <g filter="url(#shadow)">
    <rect x="40"  y="360" width="220" height="80" rx="10" fill="url(#store)" stroke="#16a34a" stroke-width="1.5"/>
    <text x="150" y="390" text-anchor="middle" font-weight="600">data-{1..N}.json</text>
    <text x="150" y="410" text-anchor="middle" font-size="12" fill="#475569">raw registry rows</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="360" width="220" height="80" rx="10" fill="url(#store)" stroke="#16a34a" stroke-width="1.5"/>
    <text x="590" y="390" text-anchor="middle" font-weight="600">germany_kreise.gpkg</text>
    <text x="590" y="410" text-anchor="middle" font-size="12" fill="#475569">multipolygons layer</text>
  </g>

  <!-- Row 4: parser + notebook -->
  <g filter="url(#shadow)">
    <rect x="260" y="480" width="280" height="80" rx="10" fill="url(#proc)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="510" text-anchor="middle" font-weight="600">parser.PowerPlant.from_json</text>
    <text x="400" y="530" text-anchor="middle" font-size="12" fill="#475569">decode enums · parse .NET dates</text>
    <text x="400" y="546" text-anchor="middle" font-size="12" fill="#475569">→ pandas DataFrame</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="480" width="280" height="80" rx="10" fill="url(#proc)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="780" y="510" text-anchor="middle" font-weight="600">wind.ipynb · spatial join</text>
    <text x="780" y="530" text-anchor="middle" font-size="12" fill="#475569">sjoin points → counties</text>
    <text x="780" y="546" text-anchor="middle" font-size="12" fill="#475569">Jenks natural-breaks bins</text>
  </g>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="940" y="360" width="200" height="80" rx="10" fill="url(#out)" stroke="#db2777" stroke-width="1.5"/>
    <text x="1040" y="390" text-anchor="middle" font-weight="600">fig/wind-YYYY-MM.png</text>
    <text x="1040" y="410" text-anchor="middle" font-size="12" fill="#475569">one frame per month</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="480" width="200" height="80" rx="10" fill="url(#out)" stroke="#db2777" stroke-width="1.5"/>
    <text x="1040" y="510" text-anchor="middle" font-weight="600">wind.gif</text>
    <text x="1040" y="530" text-anchor="middle" font-size="12" fill="#475569">ffmpeg palettegen</text>
    <text x="1040" y="546" text-anchor="middle" font-size="12" fill="#475569">+ paletteuse</text>
  </g>

  <!-- Arrows -->
  <line x1="150" y1="180" x2="150" y2="228" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="180" x2="590" y2="228" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="310" x2="150" y2="358" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="310" x2="590" y2="358" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- JSON → parser -->
  <path d="M 260 400 C 300 400, 320 480, 360 490" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- GPKG → notebook -->
  <path d="M 700 400 C 720 400, 720 480, 700 490" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- Sea → notebook -->
  <path d="M 1030 180 C 1030 300, 900 460, 900 490" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- parser → notebook -->
  <line x1="540" y1="520" x2="638" y2="520" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- notebook → PNG -->
  <path d="M 920 500 C 940 500, 970 440, 985 438" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- PNG → GIF -->
  <line x1="1040" y1="442" x2="1040" y2="478" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(40, 590)">
    <rect width="18" height="14" rx="3" fill="url(#src)" stroke="#d97706"/>
    <text x="26" y="12" font-size="12" fill="#475569">External source</text>
    <rect x="160" width="18" height="14" rx="3" fill="url(#proc)" stroke="#2563eb"/>
    <text x="186" y="12" font-size="12" fill="#475569">Processing step</text>
    <rect x="320" width="18" height="14" rx="3" fill="url(#store)" stroke="#16a34a"/>
    <text x="346" y="12" font-size="12" fill="#475569">Cached artifact</text>
    <rect x="480" width="18" height="14" rx="3" fill="url(#out)" stroke="#db2777"/>
    <text x="506" y="12" font-size="12" fill="#475569">Output</text>
  </g>
</svg>
