<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="sh4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="480" fill="#f8fafc"/>

  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">
    Frame Loop · Animation Build
  </text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#64748b">
    For each month between 2000-01-01 and today, render one PNG · then assemble
  </text>

  <!-- Timeline axis -->
  <line x1="80" y1="180" x2="1120" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="11" fill="#475569">
    <line x1="80" y1="175" x2="80" y2="185" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="205" text-anchor="middle">2000-01</text>
    <line x1="340" y1="175" x2="340" y2="185" stroke="#94a3b8" stroke-width="2"/>
    <text x="340" y="205" text-anchor="middle">2008</text>
    <line x1="600" y1="175" x2="600" y2="185" stroke="#94a3b8" stroke-width="2"/>
    <text x="600" y="205" text-anchor="middle">2015</text>
    <line x1="860" y1="175" x2="860" y2="185" stroke="#94a3b8" stroke-width="2"/>
    <text x="860" y="205" text-anchor="middle">2022</text>
    <line x1="1120" y1="175" x2="1120" y2="185" stroke="#94a3b8" stroke-width="2"/>
    <text x="1120" y="205" text-anchor="middle">today</text>
  </g>

  <!-- Frame band -->
  <rect x="80" y="120" width="1040" height="40" rx="6" fill="url(#band)" stroke="#d97706" stroke-width="1"/>
  <text x="600" y="145" text-anchor="middle" font-weight="700" fill="#7c2d12">~ 312 PNG frames (one per month)</text>

  <!-- Step labels -->
  <g filter="url(#sh4)">
    <rect x="80"  y="250" width="240" height="92" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="200" y="278" text-anchor="middle" font-weight="700">1 · Pre-compute bins</text>
    <text x="200" y="300" text-anchor="middle" font-size="12" fill="#475569">plot once at fixed date</text>
    <text x="200" y="318" text-anchor="middle" font-size="12" fill="#475569">→ Jenks edges → BINS</text>
    <text x="200" y="334" text-anchor="middle" font-size="11" fill="#64748b">stable legend across frames</text>
  </g>

  <g filter="url(#sh4)">
    <rect x="340" y="250" width="240" height="92" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="460" y="278" text-anchor="middle" font-weight="700">2 · Filter active turbines</text>
    <text x="460" y="300" text-anchor="middle" font-size="12" fill="#475569">install ≤ t and</text>
    <text x="460" y="318" text-anchor="middle" font-size="12" fill="#475569">(removal NaT or &gt; t)</text>
  </g>

  <g filter="url(#sh4)">
    <rect x="600" y="250" width="240" height="92" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="720" y="278" text-anchor="middle" font-weight="700">3 · Spatial join + sum</text>
    <text x="720" y="300" text-anchor="middle" font-size="12" fill="#475569">point-in-polygon → kreis</text>
    <text x="720" y="318" text-anchor="middle" font-size="12" fill="#475569">group power, divide 1e6</text>
  </g>

  <g filter="url(#sh4)">
    <rect x="860" y="250" width="260" height="92" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="990" y="278" text-anchor="middle" font-weight="700">4 · Save PNG</text>
    <text x="990" y="300" text-anchor="middle" font-size="12" fill="#475569">fig/wind-YYYY-MM.png</text>
    <text x="990" y="318" text-anchor="middle" font-size="12" fill="#475569">300 dpi · fixed bins</text>
  </g>

  <!-- Arrows -->
  <line x1="320" y1="296" x2="338" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="580" y1="296" x2="598" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="840" y1="296" x2="858" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>

  <!-- ffmpeg row -->
  <g filter="url(#sh4)">
    <rect x="240" y="380" width="720" height="70" rx="10" fill="#fce7f3" stroke="#db2777"/>
    <text x="600" y="408" text-anchor="middle" font-weight="700" fill="#9d174d">5 · ffmpeg palettegen + paletteuse</text>
    <text x="600" y="430" text-anchor="middle" font-size="12" fill="#475569">rename frames → frame%03d.png · scale -1:1200 lanczos · loop 0 → wind.gif</text>
  </g>

  <line x1="600" y1="344" x2="600" y2="378" stroke="#475569" stroke-width="2" marker-end="url(#a4)"/>
</svg>
